[project]
name = "dots"
version = "0.0.1"
description = "Distributed LLM inference across laptops on a LAN."
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.20.0",
    "mlx-lm>=0.20.0",
    "msgpack>=1.0.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0",
    "hf_xet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
sim = [
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_model: tests that run a real backend/model and skip when hardware or cached/network access is unavailable",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[project.scripts]
dots = "dots.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dots"]
