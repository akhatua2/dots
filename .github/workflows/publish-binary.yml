name: Build worker binary

on:
  release:
    types: [published]

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon (arm64)

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install deps (mac extras + pyinstaller)
        run: uv sync --extra mac --extra dev

      - name: Build binary
        run: uv run pyinstaller worker.spec --distpath dist/

      - name: Smoke-test
        run: ./dist/dots-worker --help

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dots-worker
