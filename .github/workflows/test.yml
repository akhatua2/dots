name: Tests

# Runs on pull requests into main (the gate). main is protected to require this
# check, so merged code is always tested — the push to main just deploys.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true            # cache the dependency store across runs
          cache-dependency-glob: uv.lock

      # Hub/client deps only (no 'mac' extra) — mlx is Apple-only; mlx tests
      # skip via pytest.importorskip.
      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check dots tests

      # Parallel across all runner cores. The suite is isolation-clean (each
      # test gets its own DOTS_HOME etc.), so -n auto distributes test
      # functions automatically and self-balances — no manual shard bookkeeping.
      - name: Tests
        run: uv run pytest tests -m "not real_model" -n auto -q
