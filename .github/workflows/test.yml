name: Tests

# Runs on pull requests into main (the gate). main itself is protected to
# require this check, so merged code is always tested — no need to re-run on
# the push to main (that just triggers the deploy).
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Hub/client deps only (no 'mac' extra) — mlx is Apple-only and not
      # installable here. mlx-specific tests skip via pytest.importorskip.
      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check dots tests

      - name: Tests
        run: uv run pytest tests -m "not real_model" -q
