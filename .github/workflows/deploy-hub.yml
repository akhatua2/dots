name: Deploy hub

# Auto-deploy the hub to the GCP VM whenever hub-relevant code lands on main.
# The VM pulls the new code, re-syncs deps, and restarts the systemd service.
on:
  push:
    branches: [main]
    paths:
      - "dots/**"
      - "pyproject.toml"
      - "uv.lock"
      - "deploy/**"
      - ".github/workflows/deploy-hub.yml"
  workflow_dispatch: {}

# Keyless auth to GCP via Workload Identity Federation (no long-lived secret).
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Private repo: ship the checked-out code to the VM (it has no GitHub
      # creds) rather than having the VM pull. A clean tarball -> scp ->
      # extract -> uv sync -> restart the systemd service.
      - name: Deploy to dots-hub
        env:
          ZONE: us-west1-a
          INSTANCE: dots-hub
          # SSH as the user that owns the hub install (uv, ~/dots, ~/.dots).
          # Without this, gcloud derives a username from the service-account
          # email and targets the wrong home dir.
          TARGET_USER: arpan
        run: |
          tar --exclude=./.git --exclude=./_external -czf /tmp/dots.tar.gz .
          gcloud compute scp /tmp/dots.tar.gz "$TARGET_USER@$INSTANCE:~/dots.tar.gz" \
            --zone="$ZONE" --quiet
          gcloud compute ssh "$TARGET_USER@$INSTANCE" --zone="$ZONE" --quiet --command '
            set -euo pipefail
            rm -rf ~/dots && mkdir -p ~/dots && tar xzf ~/dots.tar.gz -C ~/dots
            cd ~/dots && ~/.local/bin/uv sync
            sudo cp deploy/dots-hub.service /etc/systemd/system/dots-hub.service
            sudo sed -i -e "s|__USER__|$USER|g" -e "s|__APP_DIR__|$HOME/dots|g" -e "s|__HOME__|$HOME|g" /etc/systemd/system/dots-hub.service
            sudo systemctl daemon-reload
            sudo systemctl restart dots-hub
            echo "deployed"'
