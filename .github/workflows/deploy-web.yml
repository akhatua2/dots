name: Deploy web

on:
  push:
    branches: [main]
    paths: [apps/web/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        working-directory: apps/web
        run: npm ci

      # No baked-in hub URL or token — the app is invite-only. Access comes
      # from the invite link fragment (#t=<token>&api=<hub-url>), which is
      # saved to localStorage on first open. A bare visit shows "open your
      # invite link".
      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Deploy to Vercel
        working-directory: apps/web
        run: npx vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_b1qQa4LHDMAOiwsTWJrnhSYE
          VERCEL_PROJECT_ID: prj_9xma8WNvFderprhbfJCym2oIwvco
