[package]
name = "dots-macos"
version = "0.1.0"
description = "dots — native macOS client"
authors = ["dots"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dots_macos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
