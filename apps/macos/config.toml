# dots macOS app — single source of truth for non-secret defaults.
# Edit values HERE; never hardcode them in code. Each can be overridden per-run
# by the matching env var. Secrets (DOTS_JOIN_TOKEN, Mapbox) live in .env, not here.

# Model the chat/worker uses.            override: DOTS_UI_MODEL
model = "mlx-community/Qwen2.5-0.5B-Instruct-4bit"

# Hub HTTP API base (worker map data).   override: DOTS_HUB_HTTP
hub_http = "https://delpha-perse-granville.ngrok-free.dev"

# Name shown for the pool this Mac lends to.   override: DOTS_POOL_NAME
pool_name = "dots pool"

# Share of this Mac's memory always kept for its owner (never lendable).
# override: DOTS_RESERVE_FRACTION
reserve_fraction = 0.25

# Credits shown per compute unit (CU) the ledger counts.   override: DOTS_CREDITS_PER_CU
credits_per_cu = 1000

# Seconds without input before the Mac counts as idle ("Pause while I'm using it").
# override: DOTS_IDLE_SECONDS
idle_seconds = 60

# How often the lending policy re-checks power / activity / pause (seconds).
# override: DOTS_LEND_POLL_SECONDS
lend_poll_seconds = 5

# Models offered when starting a pool.
models = ["Qwen3 235B", "Llama 3.3 70B", "DeepSeek V3.1", "Kimi K2"]

# Serve the design's preview content (pools, badges, keys…) from the bridge so
# the whole UI is populated before the hub has those features. Real hub data is
# always merged in first.   override: DOTS_PREVIEW_DATA
preview_data = true

# Frontier model offered as a second opinion (paid; only called when the user
# clicks Ask Claude, and only if ANTHROPIC_API_KEY is set in .env).
frontier_model = "claude-opus-5-5"          # override: DOTS_FRONTIER_MODEL
frontier_label = "Claude Opus 5.5"          # override: DOTS_FRONTIER_LABEL
frontier_max_tokens = 1024                  # override: DOTS_FRONTIER_MAX_TOKENS
frontier_url = "https://api.anthropic.com/v1/messages"  # override: DOTS_FRONTIER_URL

# Liquid-glass look: translucent sidebar and floating panels over native macOS
# vibrancy. false (default) = the flat graphite look from the mockups.   override: DOTS_GLASS
glass = true

# The local OpenAI-compatible endpoint for apps on this Mac.   override: DOTS_GATEWAY_PORT
gateway_port = 8787

# "Saved this month" compares what ran for free against this model's price.
# USD per million tokens, input and output.   override: DOTS_COMPARE_IN / DOTS_COMPARE_OUT
compare_usd_per_mtok_in = 5.0
compare_usd_per_mtok_out = 25.0

# Credits a new API key may spend per month by default.   override: DOTS_DEFAULT_MONTHLY_LIMIT
default_monthly_limit = 500
