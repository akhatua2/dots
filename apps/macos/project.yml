name: dots
options:
  bundleIdPrefix: com.sourabhdaroji
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9P3ZR93NDF
    ARCHS: arm64
targets:
  dots:
    type: application
    platform: macOS
    sources:
      - path: dots
    # The worker ships inside the app, with uv for the drawing tool, so lending works the first time it's switched on:
    # the single-file engine
    # (core/packaging/worker.spec, `uv run --extra dev --extra mac pyinstaller packaging/worker.spec` in core/) is
    # copied into Resources when it has been built
    postCompileScripts:
      - name: Bundle the worker
        basedOnDependencyAnalysis: false
        script: |
          worker="$SRCROOT/../../core/dist/dots-worker"
          if [ -f "$worker" ]; then
            cp "$worker" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dots-worker"
          else
            echo "warning: no packaged worker at $worker; the app will lend only with DOTS_WORKER set"
          fi
          # uv, beside the worker: it sets up the tool that draws pictures on first use, on any Mac
          uv="$(command -v uv || echo "$HOME/.local/bin/uv")"
          if [ -x "$uv" ]; then
            cp "$uv" "$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/uv"
          else
            echo "warning: no uv found; Macs without it won't draw pictures"
          fi
    info:
      path: dots/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.sourabhdaroji.dots.invite
            CFBundleURLSchemes: [dots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sourabhdaroji.dots
        PRODUCT_NAME: dots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: dots
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
schemes:
  dots:
    build:
      targets:
        dots: all
    run:
      config: Debug
    archive:
      config: Release
