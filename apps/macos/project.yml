name: dots
options:
  bundleIdPrefix: com.sourabhdaroji
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9P3ZR93NDF
    ARCHS: arm64
targets:
  dots:
    type: application
    platform: macOS
    sources:
      - path: dots
    info:
      path: dots/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.sourabhdaroji.dots.invite
            CFBundleURLSchemes: [dots]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sourabhdaroji.dots
        PRODUCT_NAME: dots
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: dots
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
schemes:
  dots:
    build:
      targets:
        dots: all
    run:
      config: Debug
    archive:
      config: Release
