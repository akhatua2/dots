[project]
name = "dots"
version = "0.0.1"
description = "Distributed LLM inference across laptops on a LAN."
requires-python = ">=3.11"
# Core deps = everything the hub and chat client need, on any platform.
# Deliberately excludes mlx so the hub installs and runs on the Linux VM
# (and elsewhere) — the hub imports mlx lazily and never runs a model itself.
# `iroh` is the single network transport (QUIC p2p + NAT traversal + relays);
# it ships prebuilt wheels for macOS arm64 and linux x86_64/aarch64.
dependencies = [
    "iroh>=0.35.0,<0.36",  # its API changed after 0.35; the engine is written against 0.35
    "msgpack>=1.0.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0",
    "hf_xet>=1.0",
    # The scheduler estimates model sizes for placement via the HF API
    # (placement/model_metadata.py) — a hub-side need. On Macs it arrived
    # transitively via mlx_lm; make it explicit so the hub works on Linux.
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
# Apple-silicon compute workers: the MLX backend that runs model layers.
# Install on each Mac with `uv sync --extra mac`. mlx is Apple-only and not
# needed on the hub VM (which runs `uv sync` with no extras).
# MLX exists for macOS 14 (Darwin 23) and newer only; on an older Mac the worker installs but runs no models.
mac = [
    "mlx>=0.20.0; platform_release >= '23'",
    "mlx-lm>=0.20.0; platform_release >= '23'",
    "pillow>=10.3",  # reads the images people ask about
]
dev = [
    "pillow>=10.3",  # the image tests read and write pictures
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Runs the suite across all cores (xdist -n auto): automatic per-function
    # distribution, self-balancing, no manual shard assignment.
    "pytest-xdist>=3.5",
    "ruff>=0.8",
    "pyinstaller>=6.0",
]
sim = [
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
# Only collect our own suite — keep pytest out of vendored clones under
# _external/ (e.g. the iroh/mlx source trees used for exploration).
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_model: tests that run a real backend/model and skip when hardware or cached/network access is unavailable",
    "simulation: simulation/benchmark scenarios (minutes), not unit tests; excluded from the PR gate, run with -m simulation",
]
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[project.scripts]
dots = "dots.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
# src layout: the package lives at src/dots and imports as `dots`.
packages = ["src/dots"]
