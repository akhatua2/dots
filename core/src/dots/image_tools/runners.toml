# How a Mac draws with each family of image model: a tool dots ships for it, its version pinned.
#
# A pool that draws names its model and the original that model was made from, as the model's own card says
# (an mflux build of FLUX.2 klein 4B names black-forest-labs/FLUX.2-klein-4B). A Mac draws for the pool with
# the runner below whose `originals` include that original, or it doesn't draw there. Only the model's name
# comes with a job; the command is always one of these. `{tools}` is this folder.

[[runner]]
name = "FLUX.2 klein"
originals = ["black-forest-labs/FLUX.2-klein-4B"]
base_model = "flux2-klein-4b"
draw = ["uvx", "--from", "mflux==0.24.0", "mflux-generate-flux2"]
edit = ["uvx", "--from", "mflux==0.24.0", "mflux-generate-flux2-edit"]
macos = "14.0"

# dots' own driver, which shows the picture the model is heading for after each step (flux3_draw.py)
[[runner]]
name = "FLUX 3 Image Klein"
originals = ["black-forest-labs/flux-3-image-klein"]
base_model = "flux3-klein"
draw = ["uvx", "--from", "mflux==0.24.0", "python", "-I", "{tools}/flux3_draw.py"]
edit = ["uvx", "--from", "mflux==0.24.0", "python", "-I", "{tools}/flux3_draw.py"]
macos = "14.0"

# The same FLUX.2 klein 4B for Macs MLX doesn't run on (macOS 13): stable-diffusion.cpp, built on the Mac into
# ~/.dots/tools (infra/sdcpp.sh), reading the original's own files rather than the pool's mflux build. Slower, and
# the picture comes when it is done, with no step previews. Its 4-bit files take about 5.3 GB.
[[runner]]
name = "FLUX.2 klein"
originals = ["black-forest-labs/FLUX.2-klein-4B"]
style = "sdcpp"
draw = ["{home}/tools/sd-cli"]
extra = ["--cfg-scale", "1.0", "--offload-to-cpu"]
steps = 4
macos = "13.0"
[runner.files]
diffusion-model = "leejet/FLUX.2-klein-4B-GGUF/flux-2-klein-4b-Q4_0.gguf"
llm = "unsloth/Qwen3-4B-GGUF/Qwen3-4B-Q4_K_M.gguf"
vae = "Comfy-Org/flux2-klein-4B/split_files/vae/flux2-vae.safetensors"

# Restyles a starting picture rather than following edit instructions
[[runner]]
name = "Z-Image Turbo"
originals = ["Tongyi-MAI/Z-Image-Turbo"]
base_model = "z-image-turbo"
draw = ["uvx", "--from", "mflux==0.24.0", "mflux-generate-z-image-turbo"]
macos = "14.0"
